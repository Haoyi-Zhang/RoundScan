name: Scientific checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Replay retained finite evidence and narrow regressions
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scientific-output
          ulimit -v 2097152
          ulimit -t 500
          ulimit -f 262144
          cpu=$(python -B -c 'import os; print(min(os.sched_getaffinity(0)))')
          timeout --signal=TERM --kill-after=10s 540s taskset -c "$cpu" python -B scripts/reproduce.py 2>&1 | tee scientific-output/replay.log
      - name: Preserve raw logs and replay outputs even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scientific-checks-raw
          path: |
            scientific-output/
            results/
          if-no-files-found: error
          retention-days: 14
